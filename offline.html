<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mất kết nối - Trường Phú</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: #111827;
  }
  .panel {
    width: min(420px, 100%);
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, .08);
    padding: 24px;
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    margin: 0 auto 14px;
    background: #111827;
    color: #f59e0b;
    font-size: 28px;
    font-weight: 900;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; color: #6b7280; line-height: 1.5; font-size: 14px; }
  button {
    margin-top: 18px;
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    background: #f59e0b;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main class="panel">
    <div class="icon">TP</div>
    <h1>Không có kết nối mạng</h1>
    <p>Ứng dụng cần mạng để đọc và ghi dữ liệu mới. Vui lòng kiểm tra Wi-Fi/4G rồi thử lại.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
